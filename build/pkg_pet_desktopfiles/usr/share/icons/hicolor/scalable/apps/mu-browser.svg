<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Hintergrund-Verlauf (Tiefblau bis Cyan) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027" />
      <stop offset="50%" stop-color="#203a43" />
      <stop offset="100%" stop-color="#2c5364" />
    </linearGradient>

    <!-- Leuchtender Akzent-Verlauf -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#3a7bd5" />
    </linearGradient>

    <!-- Dezenter Schatten -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00d2ff" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Abgerundetes Quadrat (App-Hintergrund) -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bgGrad)" stroke="#3a7bd5" stroke-width="2.5" />

  <!-- Äußerer Globus-Ring -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="url(#accentGrad)" stroke-width="4.5" filter="url(#glow)" />

  <!-- Dynamischer Orbit-Bogen -->
  <ellipse cx="64" cy="64" rx="46" ry="18" transform="rotate(-28 64 64)" fill="none" stroke="#64dfdf" stroke-width="3" stroke-linecap="round" stroke-dasharray="140 24" />

  <!-- Kleiner Satelliten-/Pfeil-Punkt auf dem Orbit -->
  <circle cx="101" cy="44" r="4.5" fill="#ffffff" filter="url(#glow)" />

  <!-- Stilisiertes "µ" im Zentrum -->
  <path d="M 52 48 L 52 75 C 52 80 56 82 61 80 C 66 78 70 73 72 68 L 72 48 M 72 68 L 72 78 C 72 80 74 81 77 80" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>